# 层依赖法则的唯一权威。⛔ 改这里之前先改 ARCHITECTURE.md。
# tests/test_architecture.py 读这个文件并强制执行，不是文档，是断言。

[layers]
# 顺序即层级。下层不得知道上层的存在。
order = ["core", "setup", "world", "agent", "adapters", "suites", "scoring", "report", "runner", "cli"]

[deps]
# 每层允许 import 的其他层。⛔ 没列出的一律禁止，包括同级兄弟。
core     = []
setup    = ["core"]                # 外部依赖的一键安装，⛔ 不认识任何被测系统的内部
world    = ["core"]
agent    = ["core", "setup", "world"]      # DSH 宿主：把 world 挂到 ctx.fs 等 seam 上
adapters = ["core", "setup"]      # ⛔ 不依赖 agent：插件契约在 core，由 runner 装配
suites   = ["core", "setup", "world", "agent"]
scoring  = ["core"]
report   = ["core", "scoring"]
runner   = ["core", "setup", "world", "agent", "adapters", "suites", "scoring", "report"]
cli      = ["core", "setup", "runner", "report"]

[agent]
# agent 层是被测对象的宿主，⛔ 它本身是受控变量，不是变量。
host        = "deepseek-ai/deepseek-harness"
host_pin    = ""                  # 待定稿时钉死
host_profile = "headless"         # 一次性运行，无常驻服务
# 必须钉死的 seam：不钉死这些，跨系统的分数就不可比。
pinned_seams = ["ctx.llm", "ctx.agentLoop", "ctx.tools", "ctx.systemPrompt"]
# 由评测器提供实现的 seam：世界与计量。
provided_seams = ["ctx.fs", "ctx.tokenMeter", "ctx.sessionTelemetry"]

[adapters]
# 适配器只准薄。⛔ 上游代码不进本仓库（原则④）。
max_python_files = 10
max_total_lines  = 1000
forbidden_files  = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt"]
