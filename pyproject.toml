[project]
name = "agent-memory-bench"
version = "0.0.0"
description = "公平、公正、公开的 agent memory 能力评估框架"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# ⚠️ agent 档需要的 DSH 运行时。⛔ 不装它 → 该档记「不可用」，不是 0 分。
#    版本钉死：换 DSH 版本等于换尺子，要重跑全部基线。
agent = ["deepseek-harness-sdk==0.1.2a3"]

[project.scripts]
amb = "amb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不装包也能跑测试——CI 与本地一致
pythonpath = ["src"]
