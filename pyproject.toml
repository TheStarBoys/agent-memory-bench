[project]
name = "agent-memory-bench"
version = "0.0.0"
description = "公平、公正、公开的 agent memory 能力评估框架"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
amb = "amb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
